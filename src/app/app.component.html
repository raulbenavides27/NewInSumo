
<ion-app>
  <ion-split-pane
    contentId="main"
    [when]="isWelcomePage ? false : 'md'"
  >
    <ion-menu
      *ngIf="!isWelcomePage"
      contentId="main"
      menuId="principal"
    >
      <ion-header>
        <ion-toolbar>
          <ion-title>NewInSumo ERP</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        <ion-menu-toggle autoHide="false">
          <ion-item button="true" detail="true" [routerLink]="['/home']">
            <ion-icon slot="start" name="home-outline"></ion-icon>
            <ion-label>Inicio</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle autoHide="false">
          <ion-item button="true" detail="true" [routerLink]="['/itd']">
            <ion-icon slot="start" name="document-text-outline"></ion-icon>
            <ion-label>ITD</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle autoHide="false">
          <ion-item button="true" detail="true">
            <ion-icon slot="start" name="create-outline"></ion-icon>
            <ion-label>Próximamente</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle autoHide="false">
          <ion-item button="true" detail="true">
            <ion-icon slot="start" name="exit-outline"></ion-icon>
            <ion-label>Salir</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
